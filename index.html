<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Леся не грусти! 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Caveat:wght@700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffdde1 0%, #ee9ca7 50%, #ffb6c1 100%);
    background-attachment: fixed;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Comfortaa', cursive;
    position: relative;
  }

  /* Пузыри на фоне */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,182,193,0.4) 40%, rgba(255,105,180,0.2) 70%);
    box-shadow: 
      inset -8px -8px 20px rgba(255,105,180,0.3),
      inset 8px 8px 20px rgba(255,255,255,0.8),
      0 0 20px rgba(255,182,193,0.5);
    animation: floatUp linear infinite;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    opacity: 0;
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: 15%;
    left: 20%;
    width: 25%;
    height: 25%;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    filter: blur(2px);
  }

  .bubble .heart {
    filter: drop-shadow(0 0 5px rgba(255,0,100,0.6));
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(110vh) scale(0.5) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    90% {
      opacity: 1;
    }
    100% {
      transform: translateY(-20vh) scale(1.1) rotate(360deg);
      opacity: 0;
    }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Основной текст */
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 2rem;
  }

  .title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2.2rem, 6vw, 5rem);
    color: #fff;
    text-shadow: 
      0 0 10px rgba(255,105,180,0.9),
      0 0 20px rgba(255,20,147,0.7),
      0 0 30px rgba(255,20,147,0.5),
      3px 3px 0 rgba(199,21,133,0.4);
    animation: glow 2s ease-in-out infinite alternate, bounceIn 1.5s ease-out;
    line-height: 1.3;
    letter-spacing: 2px;
  }

  .subtitle {
    font-family: 'Caveat', cursive;
    font-size: clamp(1.8rem, 5vw, 4rem);
    color: #fff;
    margin-top: 1.5rem;
    text-shadow: 
      0 0 8px rgba(255,105,180,0.9),
      0 0 16px rgba(255,20,147,0.6),
      2px 2px 0 rgba(199,21,133,0.4);
    animation: glow 2s ease-in-out infinite alternate 0.5s, bounceIn 1.5s ease-out 0.3s backwards;
    line-height: 1.3;
  }

  @keyframes glow {
    from {
      filter: brightness(1) drop-shadow(0 0 5px rgba(255,255,255,0.5));
    }
    to {
      filter: brightness(1.2) drop-shadow(0 0 15px rgba(255,255,255,0.9));
    }
  }

  @keyframes bounceIn {
    0% {
      opacity: 0;
      transform: scale(0.3) translateY(50px);
    }
    50% {
      opacity: 1;
      transform: scale(1.1) translateY(-10px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  /* Дополнительные сердечки вокруг текста */
  .floating-heart {
    position: absolute;
    font-size: 1.5rem;
    animation: floatAround 4s ease-in-out infinite;
    filter: drop-shadow(0 0 8px rgba(255,20,147,0.8));
  }

  @keyframes floatAround {
    0%, 100% {
      transform: translateY(0) rotate(-10deg);
    }
    50% {
      transform: translateY(-20px) rotate(10deg);
    }
  }

  /* Летящие блёстки */
  .sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 10px white, 0 0 20px #ff69b4;
    animation: twinkle 2s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* Сердечный дождь */
  .falling-heart {
    position: absolute;
    top: -50px;
    font-size: 1.5rem;
    animation: fall linear infinite;
    opacity: 0.7;
  }

  @keyframes fall {
    0% {
      transform: translateY(-50px) rotate(0deg);
      opacity: 0;
    }
    10% { opacity: 0.8; }
    100% {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">Леся, не грусти! 💖</div>
  <div class="subtitle">мы погуляем!!! 🌸</div>
</div>

<script>
  const hearts = ['❤️', '💖', '💕', '💗', '💓', '💝', '💘', '🩷', '🩵', '💜'];
  const body = document.body;

  // Создаём пузыри с сердечками
  function createBubble() {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    
    const size = Math.random() * 80 + 60; // 60-140px
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = Math.random() * 100 + 'vw';
    
    const duration = Math.random() * 8 + 10; // 10-18s
    bubble.style.animationDuration = duration + 's';
    bubble.style.animationDelay = Math.random() * 5 + 's';
    
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.fontSize = (size * 0.45) + 'px';
    heart.style.animationDelay = Math.random() * 2 + 's';
    
    bubble.appendChild(heart);
    body.appendChild(bubble);

    // Удаление после анимации
    setTimeout(() => {
      bubble.remove();
    }, (duration + 5) * 1000);
  }

  // Постоянно создаём новые пузыри
  setInterval(createBubble, 400);
  // Первая партия
  for (let i = 0; i < 15; i++) {
    setTimeout(createBubble, i * 200);
  }

  // Сердечный дождь
  function createFallingHeart() {
    const heart = document.createElement('div');
    heart.className = 'falling-heart';
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
    const duration = Math.random() * 5 + 6;
    heart.style.animationDuration = duration + 's';
    body.appendChild(heart);

    setTimeout(() => heart.remove(), duration * 1000);
  }

  setInterval(createFallingHeart, 600);

  // Блёстки
  function createSparkle() {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.style.left = Math.random() * 100 + 'vw';
    sparkle.style.top = Math.random() * 100 + 'vh';
    sparkle.style.animationDelay = Math.random() * 2 + 's';
    body.appendChild(sparkle);
  }

  for (let i = 0; i < 30; i++) {
    createSparkle();
  }

  // Дополнительные парящие сердечки возле текста
  const container = document.querySelector('.container');
  const positions = [
    { top: '-40px', left: '-30px' },
    { top: '-40px', right: '-30px' },
    { bottom: '-40px', left: '-30px' },
    { bottom: '-40px', right: '-30px' },
    { top: '50%', left: '-60px' },
    { top: '50%', right: '-60px' },
  ];
  
  positions.forEach((pos, i) => {
    const h = document.createElement('span');
    h.className = 'floating-heart';
    h.textContent = ['💖', '💕', '💗', '💝', '🩷', '💓'][i];
    h.style.fontSize = (Math.random() * 15 + 20) + 'px';
    Object.assign(h.style, pos);
    h.style.animationDelay = i * 0.3 + 's';
    container.appendChild(h);
  });

  // Дополнительная анимация при клике - взрыв сердечек
  document.addEventListener('click', (e) => {
    for (let i = 0; i < 12; i++) {
      const h = document.createElement('div');
      h.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.position = 'fixed';
      h.style.left = e.clientX + 'px';
      h.style.top = e.clientY + 'px';
      h.style.fontSize = (Math.random() * 20 + 15) + 'px';
      h.style.pointerEvents = 'none';
      h.style.zIndex = '100';
      h.style.transition = 'all 1.5s ease-out';
      document.body.appendChild(h);
      
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 200 + 100;
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;
      
      requestAnimationFrame(() => {
        h.style.transform = `translate(${x}px, ${y}px) scale(0) rotate(360deg)`;
        h.style.opacity = '0';
      });
      
      setTimeout(() => h.remove(), 1500);
    }
  });
</script>

</body>
</html>
